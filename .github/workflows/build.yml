name: Build

# Inherited from upstream cln-application — runs on every PR plus manual
# dispatch. The workflow file is unchanged in spirit; this header comment
# is a one-time nudge after the fork because Actions on a freshly-forked
# repo sometimes needs a workflow-file edit before pull_request triggers
# start firing.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Get version from package.json
        id: package-version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "Project Version: $VERSION"

      - name: Cache node_modules
        uses: actions/cache@v3
        id: cache-npm-packages
        with:
          # This is an npm-workspaces repo — workspace-local deps (e.g.
          # nostr-tools in apps/frontend) live under apps/*/node_modules,
          # not the root node_modules. Caching only the root path would
          # restore an incomplete tree on cache hit and break workspace
          # builds with "Module not found". Cache both.
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ runner.OS }}-npm-v2-${{ hashFiles('**/package-lock.json') }}

      - name: Install NPM dependencies
        if: steps.cache-npm-packages.outputs.cache-hit != 'true'
        run: npm clean-install

      - name: Cache build frontend
        uses: actions/cache@v3
        id: cache-build-frontend
        with:
          path: apps/frontend
          key: ${{ runner.os }}-frontend-${{ github.sha }}

      - name: Run build production application
        run: npm run frontend:build

      - name: Cache build backend
        uses: actions/cache@v3
        id: cache-build-backend
        with:
          path: apps/backend
          key: ${{ runner.os }}-backend-${{ github.sha }}

      - name: Run build backend server
        run: npm run backend:build
